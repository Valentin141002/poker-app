<!doctype html>
<html lang="en">
<head>
  <title>The Poker Game</title>
  <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
  <link rel="stylesheet" href="static/css/text.css" type="text/css">
  <link rel="stylesheet" href="static/css/poker.css" type="text/css">
  <link rel="shortcut icon" href="static/images/chip5.png" />
  <link rel="stylesheet" href="static/css/phone.css" type="text/css"
        media="only screen and (max-width: 1400px)">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <!-- Vos anciens scripts de logique de jeu -->
  <script charset="UTF-8" src="static/js/gui_if.js"></script>
  <script charset="UTF-8" src="static/js/jsholdem/poker.js"></script>
  <script charset="UTF-8" src="static/js/jsholdem/hands.js"></script>
  <script charset="UTF-8" src="static/js/jsholdem/bot.js"></script>
  <style>
    /* Barre noire en haut */
    #top-black-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background-color: black;
      z-index: 1000;
      text-align: center;
      padding-top: 10px;
    }
    /* Message dans la barre */
    #end-game-message {
      display: inline-block;
      color: rgb(255,124,48);
      font-size: 20px;
      padding: 15px;
      border-radius: 10px;
    }
    /* Décalage pour le contenu principal */
    #game-container {
      margin-top: 70px;
    }
    /* Écran de chargement */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    #timer-container {
  position: absolute;
  top: 400px;
  right: 12px;
  width: 80px;
  height: 80px;
  pointer-events: none; /* laisse passer les clics */
  z-index: 1500;
}

#timer-svg {
  width: 100%;
  height: 100%;
}

/* On retire la transition CSS pour gérer tout en JS */
#timer-circle {
  stroke-dasharray: 226;  /* 2π×36 ≃ 226 */
  stroke-dashoffset: 0;
}
  </style>
</head>
<body onload="initGame()">
  <!-- Écran de chargement (overlay) -->
  <div id="loading-screen">
    <span id="waiting-count"></span>
  </div>
  
  <!-- Barre noire en haut -->
  <div id="top-black-bar">
    <div id="end-game-message"></div>
  </div>

  <div id="blinds-display">
    <span id="small-blind">SB: –</span>
    <span id="big-blind">BB: –</span>
  </div>   


  <!-- Contenu principal de votre jeu (votre ancien affichage, structure en cercle, etc.) -->
  <div id="game-container">
    <div id="poker_table" class="poker-table" data-uid="">
      <div id="seat0" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat1" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat2" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat3" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat4" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat5" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat6" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat7" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat8" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <div id="seat9" class="seat">
        <div class="holecards">
          <div class="card holecard1"></div>
          <div class="card holecard2"></div>
        </div>
        <div class="name-chips">
          <div class="player-name"></div>
          <div class="chips"></div>
        </div>
        <div class="bet"></div>
      </div>
      <!-- Placeholders pour le board -->
      <div id="board-placeholders">
        <div id="ph-flop1" class="board-placeholder"></div>
        <div id="ph-flop2" class="board-placeholder"></div>
        <div id="ph-flop3" class="board-placeholder"></div>
        <div id="ph-turn"  class="board-placeholder"></div>
        <div id="ph-river" class="board-placeholder"></div>
      </div>
      <!-- Board -->
      <div id="board">
        <div id="flop1" class="card boardcard"></div>
        <div id="flop2" class="card boardcard"></div>
        <div id="flop3" class="card boardcard"></div>
        <div id="turn" class="card boardcard"></div>
        <div id="river" class="card boardcard"></div>
        <div id="burn1" class="card boardcard"></div>
        <div id="burn2" class="card boardcard"></div>
        <div id="burn3" class="card boardcard"></div>
      </div>

      <div id="timer-container">
        <svg id="timer-svg" viewBox="0 0 80 80">
          <!-- Fond circulaire semi-transparent -->
          <circle cx="40" cy="40" r="38" fill="rgba(0,0,0,0.2)" stroke="none"/>
          <!-- Cercle animé -->
          <circle
            id="timer-circle"
            cx="40" cy="40" r="36"
            stroke="#00e676"
            stroke-width="6"
            fill="none"
            stroke-linecap="round"
            transform="rotate(-90 40 40)"
          />
          <!-- Texte centré -->
          <text
            id="timer-text"
            x="40" y="44"
            text-anchor="middle"
            font-size="20"
            font-family="Montserrat, sans-serif"
            fill="#fff"
          >30</text>
        </svg>
      </div>      
      
      <!-- Pot -->
      <div id="pot">
        <div id="current-pot"></div>
        <div id="total-pot"></div>
      </div>
    </div>
    <div id="button" class="seat6-button"></div>
    <div id="history"></div>
    <div id="action-options">
      <div id="fold-button" class="action-button"></div>
      <div id="call-button" class="action-button"></div>
      <a id="custom-raise" class="action-button" href="javascript:show_custom_raise()"></a>
    </div>

    <div id="quick-raises"></div>
    <div id="game-response" class="response-normal"></div>
    <div id="modal-box"></div>
    <div id="end-game-modal"></div>
    <div id="user-bar"></div>
  </div>

  <!-- Inclusion de Socket.IO : DOIT être placé avant le client.js -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Inclusion du fichier client.js pour gérer la connexion et la salle d'attente -->
  <script src="static/js/client.js"></script>
</body>
</html>
