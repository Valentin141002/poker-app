        </div>
    </div>

    <!-- Boutons d'action essentiels : Fold, Call, et Raise -->
    <div id="action-options">
        <div id="fold-button" class="action-button">Fold</div>
        <div id="call-button" class="action-button">Call</div>
        <div id="raise-button" class="action-button">Raise</div>
    </div>

    <!-- Zone d'alerte pour les winners -->
    <div id="game-response" class="response-normal">Game response</div>

    <!-- Modal pour la calculatrice de Raise -->
    <div id="raise-calculator" class="modal" style="display:none;">
      <div class="calculator-content">
        <h3>Enter your bet</h3>
        <input type="number" id="raise-amount" placeholder="Amount" />
        <button id="raise-ok-button">OK</button>
        <button id="raise-cancel-button">Cancel</button>
      </div>
    </div>

    <script>
      // Afficher le modal lors du clic sur le bouton Raise
      document.getElementById('raise-button').addEventListener('click', function(){
          document.getElementById('raise-calculator').style.display = 'flex';
      });

      // Lorsque l'utilisateur confirme son montant, envoyer la mise et fermer le modal
      document.getElementById('raise-ok-button').addEventListener('click', function(){
          var amount = document.getElementById('raise-amount').value;
          console.log("Raise amount:", amount);
          // Ici, vous pouvez intégrer l'envoi de la mise via Socket.io ou une autre méthode
          document.getElementById('raise-calculator').style.display = 'none';
      });

      // Fermer le modal sans action si l'utilisateur annule
      document.getElementById('raise-cancel-button').addEventListener('click', function(){
          document.getElementById('raise-calculator').style.display = 'none';
      });
    </script>
